<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* =========================================================
   BODY
   ========================================================= */

html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:#08040d;

  color:#fff;

}


/* =========================================================
   PANTALLA DE CARGA
   ========================================================= */

#loadingScreen{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  background:#08040d;

  z-index:9998;

  transition:
    opacity 0.25s ease;

}


#loadingScreen.hidden{

  opacity:0;

  pointer-events:none;

}


/* =========================================================
   SPINNER
   ========================================================= */

.spinner{

  width:42px;

  height:42px;

  border-radius:50%;

  border:3px solid
    rgba(212,175,55,0.20);

  border-top-color:#D4AF37;

  animation:
    spin 0.8s linear infinite;

}


/* =========================================================
   TEXTO
   ========================================================= */

.loading-text{

  margin-top:16px;

  font-size:14px;

  color:#D4AF37;

  font-weight:600;

  letter-spacing:0.3px;

}


/* =========================================================
   CHATWEB
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:#08040d;

  visibility:hidden;

  opacity:0;

  transition:
    opacity 0.2s ease,
    visibility 0.2s ease;

  z-index:9999;

}


#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

}


/* =========================================================
   ANIMACIÓN
   ========================================================= */

@keyframes spin{

  from{

    transform:rotate(0deg);

  }

  to{

    transform:rotate(360deg);

  }

}

</style>

</head>


<body>


<!-- =========================================================
     CARGANDO
     ========================================================= -->

<div id="loadingScreen">

  <div class="spinner"></div>

  <div class="loading-text">
    Cargando chat...
  </div>

</div>


<!-- =========================================================
     CHATWEB KOMMO
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loadingScreen =
  document.getElementById(
    'loadingScreen'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT
   ========================================================= */

function openReal(){

  frame.classList.add(
    'is-open'
  );


  loadingScreen.classList.add(
    'hidden'
  );


  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ CHATWEB OASIS ABIERTO'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB:',
      error
    );

  }

}


/* =========================================================
   ESPERAR CHATWEB
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB OASIS...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB OASIS LISTO'
      );


      /*
       * Abrir inmediatamente
       */

      openReal();

    }
  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>


</body>
</html>
